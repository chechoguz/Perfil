name: Actualizar datos INE

on:
  schedule:
    # El INE publica mensualmente y sube a INE.Stat 48 h hábiles después.
    - cron: '0 12 5,20 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar y normalizar datos del INE
        run: python scripts/fetch_ine.py

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/mercado-laboral.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos del INE"
          else
            git commit -m "chore(datos): actualización automática ENE — $(date +%Y-%m)"
            git push
          fi
